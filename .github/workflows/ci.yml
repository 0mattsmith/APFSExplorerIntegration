name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Portable core: build + full test suite against the committed
  # apfsck-validated fixture image.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo test --workspace

  # Windows binaries: CLI + WinFsp mount tool.
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create GitHub Releases on version tags
    env:
      # bindgen (winfsp-sys) needs libclang; the runner image ships LLVM.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Guardrail: a version tag must match the apfs-winfsp crate version,
      # otherwise the self-updater re-downloads the same release forever.
      - name: Check tag matches crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tagVer = $env:GITHUB_REF_NAME.TrimStart("v")
          $crateVer = (Select-String -Path crates/apfs-winfsp/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tagVer -ne $crateVer) {
            Write-Error "tag $env:GITHUB_REF_NAME does not match apfs-winfsp version $crateVer - bump Cargo.toml before tagging"
            exit 1
          }
          Write-Host "tag/version OK: $crateVer"

      - name: Test workspace on Windows
        run: cargo test --workspace
      - name: Build CLI (release)
        run: cargo build --release --workspace
      - name: Build apfs-mount (release)
        run: cargo build --release --manifest-path crates/apfs-winfsp/Cargo.toml
      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/apfs.exe dist/
          Copy-Item crates/apfs-winfsp/target/release/apfs-mount.exe dist/
          Copy-Item tools/install.ps1 dist/
          Copy-Item tools/install-automount.ps1 dist/
      # Guardrail: each staged exe must be the binary it claims to be
      # (catches the classic wrong-binary-in-the-zip packaging bug).
      - name: Smoke-test staged binaries
        shell: pwsh
        run: |
          $mv = & dist/apfs-mount.exe --version
          if ($LASTEXITCODE -ne 0 -or $mv -notmatch "^apfs-mount v\d") {
            Write-Error "apfs-mount.exe smoke test failed: '$mv'"
            exit 1
          }
          # apfs.exe has no --version; its usage banner identifies it.
          $cv = & dist/apfs.exe 2>&1 | Out-String
          if ($cv -notmatch "usage: apfs <info") {
            Write-Error "apfs.exe smoke test failed: '$cv'"
            exit 1
          }
          Write-Host "smoke OK: $mv"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apfs-windows-x64
          path: dist/*
          if-no-files-found: error

      # On version tags (v0.1.0, ...) publish a GitHub Release with a zip.
      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "apfs-windows-x64-$($env:GITHUB_REF_NAME).zip"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apfs-windows-x64-*.zip
          generate_release_notes: true
