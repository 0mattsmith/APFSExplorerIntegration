[package]
name = "apfs-core"
description = "Portable, minimal-dependency APFS (Apple File System) read implementation"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[features]
default = ["compress"]
# decmpfs (transparently compressed file) support. The only runtime
# dependency of the crate, pure Rust; disable for a zero-dependency build
# that reports compressed files as unsupported instead of reading them.
compress = ["dep:miniz_oxide"]

[dependencies]
miniz_oxide = { version = "0.7", optional = true }

[dev-dependencies]
# Used only to decompress the committed test fixture image.
flate2 = "1"
