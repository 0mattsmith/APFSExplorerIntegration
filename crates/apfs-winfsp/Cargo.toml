[package]
name = "apfs-winfsp"
description = "Mount APFS containers as Windows drive letters via WinFsp"
# Keep in sync with the release tag (vX.Y.Z) — the self-updater compares
# this against the latest GitHub Release.
version = "0.2.0"
edition = "2021"
# The self-updater reads owner/repo from this URL at compile time.
# (This crate is excluded from the workspace, so it can't inherit the
# workspace value — keep the literal URL here.)
repository = "https://github.com/0mattsmith/APFSExplorerIntegration"
# GPL-3.0 because the winfsp-rs bindings are GPL-3.0; the portable core
# (apfs-core) remains MIT OR Apache-2.0.
license = "GPL-3.0-only"

[[bin]]
name = "apfs-mount"
path = "src/main.rs"

[dependencies]
apfs-core = { path = "../apfs-core" }
# Deliberately NOT using the "system" feature: it locates the DLL via the
# registry at runtime, but also compiles against the installed WinFsp SDK
# headers, which the standard MSI doesn't ship (optional Developer
# component). We preload the DLL ourselves in main.rs instead, so the
# bundled headers are used for the build and any stock WinFsp install
# works at runtime.
winfsp = { version = "0.13", features = ["delayload"] }
winfsp-sys = "0.12"
# Self-update from GitHub Releases (rustls so no OpenSSL on Windows).
self_update = { version = "0.42", default-features = false, features = [
    "archive-zip",
    "compression-zip-deflate",
    "rustls",
] }

[build-dependencies]
winfsp = { version = "0.13", features = ["delayload"] }
